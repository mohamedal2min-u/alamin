name: Build Android APK

# تشغيل يدوي فقط: زر Run workflow من تبويب Actions.
# يبني تطبيق الأندرويد وينشره كـ Release عام؛ صفحة الدخول تقرأ آخر Release لتعرض «تثبيت/تحديث التطبيق».
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # التطبيق غلاف يفتح الموقع مباشرة (server.url)، لذا يكفي مجلد ويب فارغ للمزامنة
      - name: Sync Capacitor
        working-directory: frontend
        run: |
          mkdir -p out && echo '<!doctype html><title>YMD</title>' > out/index.html
          npx cap sync android

      - name: Set version
        working-directory: frontend/android/app
        run: |
          sed -i "s/versionCode 1/versionCode $((100 + VERSION_CODE))/; s/versionName \"1.0\"/versionName \"1.$VERSION_CODE\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle

      # مفتاح توقيع ثابت: السر ANDROID_KEYSTORE بصيغة «كلمة-السر:الملف-بـbase64».
      # به يُبنى إصدار release موقَّع دائماً بالمفتاح نفسه، فيتحدّث التطبيق فوق القديم دون حذفه.
      # بدونه نرجع للطريقة القديمة (نسخة debug بمفتاح عشوائي).
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "${KEYSTORE#*:}" | base64 -d > "$RUNNER_TEMP/ymd.p12"
            PW="${KEYSTORE%%:*}"
            echo "::add-mask::$PW"
            echo "YMD_KEYSTORE_FILE=$RUNNER_TEMP/ymd.p12" >> "$GITHUB_ENV"
            echo "YMD_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "تم استخدام مفتاح التوقيع الثابت"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "::warning::لا يوجد السر ANDROID_KEYSTORE؛ التوقيع عشوائي ولن يتحدّث التطبيق فوق نسخة سابقة"
          fi

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          # release: APK للتحميل من الموقع + AAB للرفع على Google Play (الموقَّع بالمفتاح نفسه = مفتاح الرفع)
          if [ "$BUILD_TYPE" = release ]; then ./gradlew assembleRelease bundleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((100 + VERSION_CODE))
          cp "frontend/android/app/build/outputs/apk/$BUILD_TYPE/app-$BUILD_TYPE.apk" "ymd-$CODE.apk"
          FILES="ymd-$CODE.apk"
          if [ "$BUILD_TYPE" = release ]; then
            cp frontend/android/app/build/outputs/bundle/release/app-release.aab "ymd-$CODE.aab"
            FILES="$FILES ymd-$CODE.aab"
          fi
          gh release create "apk-$CODE" $FILES \
            --title "YMD $CODE" \
            --notes "نسخة تطبيق الأندرويد رقم $CODE" \
            --latest
