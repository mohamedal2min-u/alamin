name: Deploy to server

# تشغيل يدوي فقط: زر Run workflow من تبويب Actions. لا ينشر تلقائياً عند الدمج.
on:
  workflow_dispatch:
    inputs:
      target:
        description: ماذا تنشر؟
        type: choice
        options: [backend, frontend, both]
        default: backend
      confirm:
        description: اكتب DEPLOY للتأكيد (النشر يشغّل ترحيلات على قاعدة بيانات الإنتاج)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVER_HOST: 82.29.181.61

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation and branch
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          [ "$CONFIRM" = "DEPLOY" ] || { echo "اكتب DEPLOY بالضبط للتأكيد"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "النشر مسموح من فرع main فقط (الحالي: $REF)"; exit 1; }

  backend:
    needs: guard
    if: inputs.target == 'backend' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/deploy
      - name: Deploy backend (as alamin-api)
        env:
          SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
          # مفتاح حساب Firebase (ملف JSON كامل) لإشعارات الهاتف؛ يُكتب على السيرفر خارج المستودع
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s %s\n' "$SERVER_HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          set +e
          out=$(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "alamin-api@$SERVER_HOST" 'bash -s' < .github/deploy/backend.sh 2>&1)
          rc=$?
          if [ "$rc" -eq 0 ] && [ -n "$FIREBASE_SA" ]; then
            if printf '%s' "$FIREBASE_SA" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("type")=="service_account" and d.get("private_key")'; then
              printf '%s' "$FIREBASE_SA" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
                  "alamin-api@$SERVER_HOST" 'umask 077 && cat > /home/alamin-api/app/backend/storage/app/firebase-service-account.json && cd /home/alamin-api/app/backend && /usr/bin/php8.3 artisan cache:forget fcm_access_token >/dev/null 2>&1; echo "Firebase key: written"'
              out="$out"$'\n'"Firebase key: ok"
            else
              out="$out"$'\n'"Firebase key: السر FIREBASE_SERVICE_ACCOUNT ليس ملف service account صالحاً"
              rc=1
            fi
          fi
          set -e
          rm -f ~/.ssh/id_deploy
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            # يظهر سبب الفشل في ملاحظات التشغيل (Annotations) دون الحاجة لفتح السجل
            msg=$(printf '%s' "$out" | tail -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فشل النشر (رمز $rc)::$msg"
            exit "$rc"
          fi

  frontend:
    # بعد الباك إند عند اختيار both، حتى لا تصل واجهة جديدة لـ API قديم
    needs: [guard, backend]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (inputs.target == 'frontend' || inputs.target == 'both') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/deploy
      - name: Deploy frontend (as maa)
        env:
          SSH_KEY: ${{ secrets.FRONTEND_SSH_KEY }}
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s %s\n' "$SERVER_HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          set +e
          out=$(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "maa@$SERVER_HOST" 'bash -s' < .github/deploy/frontend.sh 2>&1)
          rc=$?
          set -e
          rm -f ~/.ssh/id_deploy
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            # يظهر سبب الفشل في ملاحظات التشغيل (Annotations) دون الحاجة لفتح السجل
            msg=$(printf '%s' "$out" | tail -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فشل النشر (رمز $rc)::$msg"
            exit "$rc"
          fi
